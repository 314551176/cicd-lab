name: CI Pipeline

on:
  push:
    branches:
      - [cite_start]'**' # 符合 push 時自動執行要求 (20%) [cite: 7]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24'] # 跨版本測試策略
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck # TypeScript 檢查 (20%) [cite: 9]

      - name: Prettier check
        run: npm run format:check # Prettier 檢查 (20%) [cite: 10]

      - name: Run tests
        # 使用多重 reporter：
        # 1. github-summary: 直接將結果印在 Action 主頁面 (滿足老師要求)
        # 2. junit: 產生 XML 檔案供後續報表工具使用
        run: npx vitest run --reporter=default --reporter=github-summary --reporter=junit --outputFile=test-results.xml
        # 測試執行 (20%) [cite: 11]

      - name: Publish Test Report (Detailed Summary)
        uses: dorny/test-reporter@v1
        if: always() # 關鍵：確保失敗時也會執行，將錯誤訊息顯示於結果頁面 (20%) [cite: 12, 13]
        with:
          name: Vitest Tests Results (${{ matrix.node-version }})
          path: test-results.xml
          reporter: java-junit
          list-suites: 'failed'
          list-tests: 'failed'

      - name: Compute image tag
        id: meta
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          if [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            IMAGE_TAG="release-${VERSION}"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        if: ${{ matrix.node-version == '24' }}
        run: docker build -t my-app:${{ steps.meta.outputs.image_tag }} .

  # 只有在 release 分支時才觸發 CD
  cd:
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    needs: ci
    uses: ./.github/workflows/cd.yaml